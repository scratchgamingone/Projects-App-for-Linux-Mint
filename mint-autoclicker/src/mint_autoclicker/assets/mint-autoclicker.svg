<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2329"/>
      <stop offset="100%" stop-color="#15181c"/>
    </linearGradient>
    <linearGradient id="mint-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="url(#bg-grad)" stroke="#343c48" stroke-width="6"/>

  <!-- Click Ripple Waves -->
  <path d="M 160 110 A 150 150 0 0 1 352 110" fill="none" stroke="#2ecc71" stroke-width="12" stroke-linecap="round" opacity="0.8" filter="url(#glow)"/>
  <path d="M 190 140 A 110 110 0 0 1 322 140" fill="none" stroke="#2ecc71" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
  <path d="M 220 165 A 70 70 0 0 1 292 165" fill="none" stroke="#a3e9b9" stroke-width="8" stroke-linecap="round"/>

  <!-- Mouse Silhouette Body -->
  <rect x="176" y="170" width="160" height="230" rx="76" ry="76" fill="#2d343f" stroke="#4a5568" stroke-width="6"/>

  <!-- Left Button Highlight (Active Clicking) -->
  <path d="M 182 246 L 182 240 A 70 70 0 0 1 252 176 L 252 246 Z" fill="url(#mint-grad)"/>

  <!-- Mouse Dividers -->
  <line x1="256" y1="174" x2="256" y2="250" stroke="#1e2329" stroke-width="6"/>
  <line x1="176" y1="250" x2="336" y2="250" stroke="#1e2329" stroke-width="6"/>

  <!-- Mouse Wheel -->
  <rect x="246" y="196" width="20" height="42" rx="10" ry="10" fill="#15181c" stroke="#2ecc71" stroke-width="4"/>

  <!-- Lightning Bolt (High Speed Auto Clicker Badge) -->
  <path d="M 370 290 L 330 360 L 354 360 L 334 430 L 400 346 L 372 346 Z" fill="#f1c40f" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
</svg>
