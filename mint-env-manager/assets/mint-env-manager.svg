<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base with rounded squircle -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#shadow)"/>

  <!-- Admin Security Shield -->
  <path d="M 128,42 L 188,68 C 188,130 162,176 128,198 C 94,176 68,130 68,68 Z" fill="url(#shieldGrad)" opacity="0.9" stroke="#34d399" stroke-width="3"/>

  <!-- Terminal / Environment Symbol inside Shield -->
  <path d="M 88,100 L 110,118 L 88,136" fill="none" stroke="#f0fdf4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="118" y1="136" x2="142" y2="136" stroke="#f0fdf4" stroke-width="6" stroke-linecap="round"/>

  <!-- Golden API Key Symbol floating in foreground -->
  <g filter="url(#shadow)" transform="translate(10, 10)">
    <!-- Key Head -->
    <circle cx="160" cy="155" r="26" fill="none" stroke="url(#keyGrad)" stroke-width="8"/>
    <circle cx="160" cy="155" r="10" fill="url(#keyGrad)"/>
    <!-- Key Stem -->
    <line x1="142" y1="168" x2="98" y2="202" stroke="url(#keyGrad)" stroke-width="8" stroke-linecap="round"/>
    <!-- Key Teeth -->
    <line x1="114" y1="190" x2="124" y2="202" stroke="url(#keyGrad)" stroke-width="7" stroke-linecap="round"/>
    <line x1="102" y1="199" x2="110" y2="210" stroke="url(#keyGrad)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Verification Check Badge -->
  <circle cx="196" cy="76" r="20" fill="#22c55e" stroke="#ffffff" stroke-width="3" filter="url(#shadow)"/>
  <path d="M 188,76 L 194,82 L 205,70" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
