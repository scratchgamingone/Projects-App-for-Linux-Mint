<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1abc9c"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#2d3342" stroke-width="8"/>

  <!-- Terminal Top Bar Window Buttons -->
  <circle cx="96" cy="96" r="14" fill="#ff5f56"/>
  <circle cx="136" cy="96" r="14" fill="#ffbd2e"/>
  <circle cx="176" cy="96" r="14" fill="#27c93f"/>

  <!-- Command Prompt Chevron: > -->
  <path d="M 112 180 L 210 256 L 112 332" fill="none" stroke="url(#mintGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Terminal Cursor / Run Underline: _ -->
  <line x1="236" y1="332" x2="340" y2="332" stroke="url(#mintGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Shell Script Badge '.sh' -->
  <rect x="250" y="160" width="160" height="68" rx="18" fill="#1f2430" stroke="#3b4252" stroke-width="4"/>
  <text x="330" y="208" font-family="monospace, sans-serif" font-size="38" font-weight="900" fill="#2ecc71" text-anchor="middle">.SH</text>

  <!-- Git Branch Nodes / GitHub Accent -->
  <g transform="translate(140, 260)">
    <!-- Branch Line -->
    <path d="M 180 140 L 180 80 Q 180 40 220 40 L 260 40" fill="none" stroke="url(#gitGrad)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 180 140 L 180 20" fill="none" stroke="url(#gitGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="180" cy="140" r="18" fill="url(#gitGrad)"/>
    <circle cx="180" cy="20" r="18" fill="url(#gitGrad)"/>
    <circle cx="260" cy="40" r="18" fill="url(#mintGrad)"/>
  </g>
</svg>
